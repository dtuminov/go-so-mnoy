services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: go_so_mnoy
      POSTGRES_PASSWORD: go_so_mnoy
      POSTGRES_DB: go_so_mnoy
    ports:
      - "5432:5432"
    volumes:
      - go_so_mnoy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_so_mnoy -d go_so_mnoy"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  go_so_mnoy_pgdata:
